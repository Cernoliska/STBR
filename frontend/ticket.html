<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Formulir Tiket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>Formulir Permohonan Tiket</header>

  <div class="card" id="form-area">
    <p>Memuat formulir...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type");
    const area = document.getElementById("form-area");

    const renderForm = () => {
      let html = "";
      switch (type) {
        case "akun":
        case "sementara":
        case "ip":
          html = `
            <h3>Banding Blokir ${type === "ip" ? "Alamat IP" : "Akun"}</h3>
            <label>Nama akun / alamat IP:</label>
            <input id="username" type="text" placeholder="Nama atau IP" />
            <label>Alasan kenapa Anda harus dibuka blokirnya:</label>
            <textarea id="reason" rows="4"></textarea>
            <button onclick="submitTicket()">Kirim</button>`;
          break;
        case "revisi":
          html = `
            <h3>Permohonan Penghapusan Revisi</h3>
            <label>Pranala Revisi:</label>
            <input id="revision_link" type="text" placeholder="https://id.wikipedia.org/wiki/?diff=..." />
            <label>Alasan kenapa revisi tersebut harus dihapus / disembunyikan:</label>
            <textarea id="reason" rows="4"></textarea>
            <button onclick="submitTicket()">Kirim</button>`;
          break;
        default:
          html = "<p>Tipe tidak dikenal.</p>";
      }
      area.innerHTML = html;
    };

    async function submitTicket() {
      const data = {
        type,
        username: document.getElementById("username")?.value || "",
        ip: type === "ip" ? document.getElementById("username").value : "",
        revision_link: document.getElementById("revision_link")?.value || "",
        reason: document.getElementById("reason")?.value,
        comments: "",
      };
      await fetch("/api/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      location.href = "timeline.html";
    }

    renderForm();
  </script>
</body>
  </html>
