<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Timeline</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>STBR – Sistem Tiket Banding dan Revisi</header>
<main id="main"></main>
<script>
async function load(){
  const res = await fetch("/api/tickets");
  const data = await res.json();
  document.getElementById("main").innerHTML = data.map(t => `
    <div class="card">
      <strong>[${t.type}]</strong> ${t.username || t.ip_address}
      <p>${t.reason}</p>
      <small>${t.created_at} • Status: ${t.status}</small>
      <div><a href="tiket.html?key=${encodeURIComponent(t.key_token)}">Lihat</a></div>
    </div>
  `).join('');
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
