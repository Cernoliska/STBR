<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Detail Tiket</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>STBR – Sistem Tiket Banding dan Revisi</header>
<main>
  <div class="card" id="box">Memuat...</div>
</main>
<script>
const params = new URLSearchParams(location.search);
const key = params.get("key");
const box = document.getElementById("box");
async function load(){
  if(!key) { box.innerHTML = "<p>Tidak ada kunci</p>"; return; }
  const res = await fetch("/api/tickets/" + encodeURIComponent(key));
  if (!res.ok) { box.innerHTML = "<p>Tiket tidak ditemukan</p>"; return; }
  const t = await res.json();
  box.innerHTML = `
    <h3>${t.type}</h3>
    <p><b>Kunci:</b> ${t.key_token}</p>
    <p><b>User/IP:</b> ${t.username || t.ip_address}</p>
    <p><b>Alasan:</b> ${t.reason}</p>
    <p><b>Status:</b> <span class="status ${t.status}">${t.status}</span></p>
    <h4>Timeline</h4>
    <div id="timeline"></div>
  `;
  const eventsRes = t.events || [];
  const timeline = document.getElementById("timeline");
  if (!eventsRes.length) timeline.innerHTML = "<i>Belum ada aktivitas</i>";
  else timeline.innerHTML = eventsRes.map(ev => `<div class="card"><small>${ev.time}</small><p>${ev.text}</p></div>`).join("");
}
load();
</script>
</body>
</html>
